[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harmonyos-project-scaffolder"
version = "0.1.0"
description = "Scaffold standalone HarmonyOS Cangjie projects from Jinja templates."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Cangjie Programming Language UK Team" },
]
dependencies = [
  "jinja2>=3.1,<4",
]

[project.scripts]
harmonyos-scaffold = "harmonyos_scaffolder.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/harmonyos_scaffolder"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/example",
  "/src",
  "/tests",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
